<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Trận Đấu - ELITE STADIUM</title>
    <!-- Import font Inter giống thiết kế -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/match-detail.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">ELITE STADIUM</div>
        <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" placeholder="Tìm kiếm trận đấu...">
        </div>
        <div class="nav-icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="match-layout">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <!-- Scoreboard -->
            <div class="scoreboard" id="matchHeader">
                <!-- JS Render -->
            </div>

            <!-- Video Player -->
            <div class="video-container">
                <img src="imgs/image.png" alt="Stadium">
            </div>

            <!-- Server Actions -->
            <div class="server-actions">
                <span>Nguồn phát:</span>
                <div style="display: flex; gap: 12px;" id="serverList">
                    <!-- JS Render -->
                </div>
            </div>

            <!-- Timeline Events -->
            <div class="timeline-container">
                <div class="timeline-title">⏱️ Diễn Biến Trận Đấu</div>
                <div class="timeline-list" id="eventTimeline">
                    <!-- JS Render -->
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (CHAT) -->
        <div class="right-panel">
            <div class="chat-header">
                <div class="chat-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    Trò Chuyện Trực Tiếp
                </div>
                <div class="viewers">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                    14.2k người xem
                </div>
            </div>
            
            <div class="chat-messages" id="chatBox">
                <!-- JS Render -->
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" id="chatInput" placeholder="Gửi tin nhắn..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS LOGIC -->
    <script src="data.js"></script>

<script>
    // 1. Lấy ID từ URL
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = parseInt(urlParams.get('id')) || 1; 

    // 2. Lấy trận đấu từ window.db (đã nạp từ data.js)
    const match = window.db.tblMatch.find(m => m.matchId === matchId);

    document.addEventListener('DOMContentLoaded', () => {
        if (!match) {
            alert("Không tìm thấy trận đấu!");
            return;
        }
        
        // Kiểm tra xem người dùng có bị cấm chat không
        const currentUserNick = sessionStorage.getItem('viewerNick') || "Khách";
        if (!window.db.tblGuest) {
            window.db.tblGuest = [];
        }
        
        const bannedUser = window.db.tblGuest.find(g => g.tblUserID === currentUserNick && g.status === 'Banned');
        const chatInput = document.getElementById('chatInput');
        
        if (bannedUser) {
            // Disable chat input nếu người dùng bị cấm
            chatInput.disabled = true;
            chatInput.placeholder = `⛔ Bạn đã bị cấm chat (${bannedUser.banReason || 'Không xác định'})`;
            chatInput.style.opacity = '0.5';
            
            // Hiển thị thông báo cấm trong chat box
            const chatBox = document.getElementById('chatBox');
            const banNotice = document.createElement('div');
            banNotice.style.cssText = 'background: rgba(239, 68, 68, 0.15); color: #ef4444; padding: 16px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #ef4444; font-size: 14px; font-weight: 600;';
            banNotice.innerHTML = `
                🚫 <strong>Bạn đã bị cấm chat!</strong><br/>
                <small style="color: var(--text-muted); margin-top: 6px; display: block;">Lý do: ${bannedUser.banReason || 'Không xác định'}</small>
            `;
            chatBox.appendChild(banNotice);
        }
        
        renderHeader();
        renderServers();
        renderChat();
        renderTimeline();
    });

    // Tự động cập nhật dữ liệu khi có thay đổi từ tab khác (Admin hoặc người xem khác)
    window.addEventListener('storage', (e) => {
        if (e.key === 'livestream_data') {
            // Nạp lại dữ liệu mới nhất
            window.db = JSON.parse(e.newValue);
            
            // Vẽ lại khung chat ngay lập tức với bình luận mới
            renderChat();
            
            // Tự động cập nhật luôn cả tỉ số, thẻ phạt nếu Admin vừa thay đổi
            renderHeader(); 
        }
    });

    function getTeam(id) { return window.db.tblTeam.find(t => t.teamId === id) || {name: "Unknown"}; }

    function renderTimeline() {
        const events = window.db.tblMatchEvent.filter(e => e.matchId === matchId).sort((a,b) => b.minute - a.minute);
        const box = document.getElementById('eventTimeline');
        
        if (events.length === 0) {
            box.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>Chưa có diễn biến nào được cập nhật.</p>";
            return;
        }

        const icons = { "Goal": "⚽", "Yellow Card": "🟨", "Red Card": "🟥", "Substitution": "🔄" };
        const typeVn = { "Goal": "Ghi bàn", "Yellow Card": "Thẻ vàng", "Red Card": "Thẻ đỏ", "Substitution": "Thay người" };
        
        box.innerHTML = events.map(e => {
            const player = window.db.tblPlayer.find(p => p.id == e.playerId);
            const subPlayer = e.subPlayerId ? window.db.tblPlayer.find(p => p.id == e.subPlayerId) : null;
            const team = window.db.tblTeam.find(t => t.teamId === player.teamId);
            const typeClass = e.type.toLowerCase().replace(' ', '');
            
            let desc = `${typeVn[e.type] || e.type}: ${player.name}`;
            if (subPlayer) {
                desc = `Thay người: <span style="color:var(--accent-red)">${player.name}</span> 🔄 <span style="color:var(--accent-green)">${subPlayer.name}</span>`;
            }

            return `
                <div class="timeline-event ${typeClass}">
                    <div class="event-min">${e.minute}'</div>
                    <div class="event-icon">${icons[e.type] || '•'}</div>
                    <div class="event-desc">
                        ${desc}
                        <span class="event-player">(${team.shortName})</span>
                    </div>
                </div>`;
        }).join('');
    }

    function renderHeader() {
        const home = getTeam(match.homeTeamId);
        const away = getTeam(match.awayTeamId);
        document.getElementById('matchHeader').innerHTML = `
            <div class="live-indicator"><div class="live-dot"></div> LIVE</div>
            <div class="score-center">
                <div class="team-info">
                    <div class="team-name">${home.name}</div>
                    <div class="team-score">${match.homeScore}</div>
                </div>
                <div class="score-vs">VS</div>
                <div class="team-info">
                    <div class="team-name">${away.name}</div>
                    <div class="team-score">${match.awayScore}</div>
                </div>
            </div>
            <div class="match-time">${match.currentTime}'</div>`;
    }

    function renderChat() {
        // Lọc bình luận theo tblLiveChatID của trận đấu hiện tại
        const msgs = window.db.tblCommentDetail.filter(c => c.tblLiveChatID === match.tblLiveChatID && c.status === "Visible");
        const box = document.getElementById('chatBox');
        
        box.innerHTML = msgs.map(m => {
            const isAdmin = m.tblUserID === 3;
            return `
                <div class="msg-bubble ${isAdmin ? 'mod' : ''}">
                    <div class="msg-user">${isAdmin ? '🛡️ Admin' : m.tblUserID}</div>
                    <div class="msg-text">${m.content}</div>
                </div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
    }

    function sendChat() {
        const input = document.getElementById('chatInput');
        if (!input.value.trim()) return;
        
        const currentUserNick = sessionStorage.getItem('viewerNick') || "Khách";
        
        // Kiểm tra xem người dùng có bị cấm hay không
        if (!window.db.tblGuest) {
            window.db.tblGuest = [];
        }
        
        const bannedUser = window.db.tblGuest.find(g => g.tblUserID === currentUserNick && g.status === 'Banned');
        
        if (bannedUser) {
            // Hiển thị cảnh báo người dùng bị cấm
            const chatBox = document.getElementById('chatBox');
            const banNotice = document.createElement('div');
            banNotice.style.cssText = 'background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 3px solid #ef4444; font-size: 13px;';
            banNotice.innerHTML = `
                ⛔ <strong>Bạn đã bị cấm chat!</strong><br/>
                Lý do: ${bannedUser.banReason || 'Không xác định'}<br/>
                <small>Liên hệ Admin để gỡ cấm</small>
            `;
            chatBox.appendChild(banNotice);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            input.value = '';
            input.placeholder = "Bạn đã bị cấm chat - Liên hệ Admin";
            input.disabled = true;
            return;
        }
        
        window.db.tblCommentDetail.push({
            ID: Date.now(),
            tblLiveChatID: match.tblLiveChatID,
            tblUserID: currentUserNick,
            content: input.value,
            status: "Visible"
        });
        
        window.saveData(); // Lưu vào localStorage
        input.value = '';
        renderChat();
    }
    
    function renderServers() {
        const links = window.db.tblLinkStream.filter(l => l.matchId === matchId);
        const srvBox = document.getElementById('serverList');
        srvBox.innerHTML = links.map((l, i) => `
            <button class="server-btn ${i===0?'active':''}">
                ${l.serverName}
            </button>`).join('');
    }
</script>
</body>
</html>
